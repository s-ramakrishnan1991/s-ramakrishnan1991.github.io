baseURL = 'https://s-ramakrishnan1991.github.io/'
languageCode = 'en-us'
title = 'Sreenivas Ramakrishnan'
theme = 'PaperMod'

[params]
    env = 'production'
    description = "Sreenivas Ramakrishnan's Personal Website" # Change this
    author = "Sreenivas Ramakrishnan"
	fingerprint = false
    
    # Profile Mode settings (matches the home page of the link provided)
    [params.profileMode]
        enabled = true
        title = "Sreenivas Ramakrishnan"
        subtitle = "Optical Engineer, Quantum Technology Fanatic"
        imageUrl = "img/profile.jpg" # Place your photo in static/img/profile.jpg
        imageWidth = 120
        imageHeight = 120

    # Social links (icons at the bottom)
    [[params.socialIcons]]
        name = "github"
        url = "https://github.com/s-ramakrishnan1991"
    [[params.socialIcons]]
        name = "linkedin"
        url = "https://linkedin.com/in/sreenivas-ramakrishnan/"
    [[params.socialIcons]]
        name = "xing"
        url = "https://www.xing.com/profile/Sreenivas_Ramakrishnan/web_profiles"
	[[params.socialIcons]]
		name = "email"
		url = "mailto:sreenivas.ramakrishnan1991@gmail.com"

# Menu Navigation
[[menu.main]]
    name = "About"
    url = "/about"
    weight = 10
[[menu.main]]
